[build]
  command = "pnpm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# sharp is a native module (the Telegram webhook converts photos with it):
# ship it from node_modules instead of letting the bundler inline it, so
# the Linux binary Netlify installed at build time comes along.
[functions]
  external_node_modules = ["sharp"]

# [[redirects]]
#   from = "/weeknotes/"
#   to = "https://tanvibhakta.mataroa.blog"
#   status = 302
#   force = true


[[redirects]]
  from = "/resume/"
  to = "/resume.pdf"
  status = 301
  force = true

[[redirects]]
  from = "/code/"
  to = "https://github.com/tanvibhakta"
  status = 301
  force = true

[[redirects]]
  from = "/lhtl/"
  to = "/2018nov12-01"
  status = 301
  force = true

[[redirects]]
  from = "/api/subscribe"
  to = "https://epi.stic.earth/api/public/subscription"
  status = 200
  force = true

[[plugins]]
  package = "./netlify/plugins/build-time-alert"
