[[redirects]]
  from = "/resume/"
  to = "/resume.pdf"
  status = 301
  force = true

[[redirects]]
  from = "/code/"
  to = "https://github.com/tanvibhakta"
  status = 301
  force = true

[[redirects]]
  from = "/api/subscribe"
  to = "https://epi.stic.earth/api/public/subscription"
  status = 200
  force = true

[[plugins]]
  package = "./netlify/plugins/build-time-alert"
