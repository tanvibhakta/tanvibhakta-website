# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json
local_backend: true
backend:
  name: github
  repo: tanvibhakta/tanvibhakta-website
  branch: main

media_folder: public/media
public_folder: /media

collections:
  - name: blog
    label: Blog
    folder: posts/blog
    media_folder: images
    public_folder: images
    create: true
    slug: "{{slug}}"
    view_filters:
      - label: Drafts
        field: draft
        pattern: true
    sortable_fields:
      fields: [title, publishedOn]
      default:
        field: publishedOn
        direction: descending
    fields:
      - { label: Title, name: title, widget: string }
      # "{{now}}" prefills when the entry is first created in the editor, not
      # when Publish is hit — adjust before publishing if the draft sat a while.
      - {
          label: Publish Date,
          name: publishedOn,
          widget: datetime,
          date_format: YYYY-MM-DD,
          time_format: "HH:mm",
          format: "YYYY-MM-DDTHH:mm:ssZ",
          default: "{{now}}",
        }
      - {
          label: Draft,
          name: draft,
          widget: boolean,
          default: true,
          required: false,
        }
      # Raw mode first, so the editor opens on markdown source. In rich text
      # mode, pasted markdown is treated as literal prose and saved escaped
      # (\*x\*, \>, \---), which renders as visible symbols. See
      # docs/markdown-pipelines.md.
      - &bodyField
        label: Body
        name: body
        widget: markdown
        modes: [raw, rich_text]
      - label: Audio
        name: audio
        widget: file
        required: false
        media_folder: /public/media/audio
        public_folder: /media/audio
      - {
          label: Audio Title,
          name: audioTitle,
          widget: string,
          required: false,
        }
      # Single definition of the tags field, aliased into every other
      # collection below. A plain list: type a new kebab-case tag on any post
      # and it joins the site-wide tag list (derived from posts at build time).
      # The content schema rejects non-kebab-case tags at build.
      - &tagsField
        label: Tags
        name: tags
        widget: list
        required: false

  - name: poetry
    label: Poetry
    folder: posts/poetry
    media_folder: images
    public_folder: images
    create: true
    slug: "{{slug}}"
    view_filters:
      - label: Drafts
        field: draft
        pattern: true
    sortable_fields:
      fields: [title, publishedOn]
      default:
        field: publishedOn
        direction: descending
    fields:
      - { label: Title, name: title, widget: string }
      # "{{now}}" prefills when the entry is first created in the editor, not
      # when Publish is hit — adjust before publishing if the draft sat a while.
      - {
          label: Publish Date,
          name: publishedOn,
          widget: datetime,
          date_format: YYYY-MM-DD,
          time_format: "HH:mm",
          format: "YYYY-MM-DDTHH:mm:ssZ",
          default: "{{now}}",
        }
      - {
          label: Draft,
          name: draft,
          widget: boolean,
          default: true,
          required: false,
        }
      - *bodyField
      - label: Audio
        name: audio
        widget: file
        required: false
        media_folder: /public/media/audio
        public_folder: /media/audio
      - {
          label: Audio Title,
          name: audioTitle,
          widget: string,
          required: false,
        }
      - *tagsField

  - name: weeknotes
    label: Weeknotes
    folder: posts/weeknotes
    media_folder: images
    public_folder: images
    create: true
    slug: "{{slug}}"
    view_filters:
      - label: Drafts
        field: draft
        pattern: true
    sortable_fields:
      fields: [title, publishedOn]
      default:
        field: publishedOn
        direction: descending
    fields:
      - { label: Title, name: title, widget: string }
      # "{{now}}" prefills when the entry is first created in the editor, not
      # when Publish is hit — adjust before publishing if the draft sat a while.
      - {
          label: Publish Date,
          name: publishedOn,
          widget: datetime,
          date_format: YYYY-MM-DD,
          time_format: "HH:mm",
          format: "YYYY-MM-DDTHH:mm:ssZ",
          default: "{{now}}",
        }
      - {
          label: Draft,
          name: draft,
          widget: boolean,
          default: true,
          required: false,
        }
      - *tagsField
      - label: Body
        name: body
        widget: markdown
        modes: [raw, rich_text]
        default: "## Work\n\n## Life\n\n## Health\n\n## Learning\n\n## Media Diet\n\n### Reading\n\n### Watching\n\n### Listening\n\n### Around the web\n"

  - name: digitalGarden
    label: Digital Garden
    folder: posts/digital-garden
    media_folder: images
    public_folder: images
    create: true
    slug: "{{slug}}"
    view_filters:
      - label: Drafts
        field: draft
        pattern: true
    sortable_fields:
      fields: [title, publishedOn, lastUpdatedOn]
      default:
        field: publishedOn
        direction: descending
    fields:
      - { label: Title, name: title, widget: string }
      # "{{now}}" prefills when the entry is first created in the editor, not
      # when Publish is hit — adjust before publishing if the draft sat a while.
      - {
          label: Publish Date,
          name: publishedOn,
          widget: datetime,
          date_format: YYYY-MM-DD,
          time_format: "HH:mm",
          format: "YYYY-MM-DDTHH:mm:ssZ",
          default: "{{now}}",
        }
      - {
          label: Last Updated,
          name: lastUpdatedOn,
          widget: datetime,
          date_format: YYYY-MM-DD,
          time_format: "HH:mm",
          format: "YYYY-MM-DDTHH:mm:ssZ",
          default: "{{now}}",
        }
      - {
          label: Description,
          name: description,
          widget: string,
          required: false,
        }
      - {
          label: Draft,
          name: draft,
          widget: boolean,
          default: true,
          required: false,
        }
      - *tagsField
      - *bodyField

  - name: notes
    label: Notes
    folder: posts/notes
    media_folder: images
    public_folder: images
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{hour}}{{minute}}"
    summary: "{{body}}"
    sortable_fields:
      fields: [publishedOn]
      default:
        field: publishedOn
        direction: descending
    fields:
      - {
          label: Published,
          name: publishedOn,
          widget: datetime,
          format: "YYYY-MM-DDTHH:mm:ss",
          default: "{{now}}",
        }
      - *tagsField
      - *bodyField

  - name: pages
    label: Pages
    folder: posts/pages
    media_folder: images
    public_folder: images
    create: true
    slug: "{{slug}}"
    view_filters:
      - label: Drafts
        field: draft
        pattern: true
    fields:
      - { label: Title, name: title, widget: string }
      - {
          label: Draft,
          name: draft,
          widget: boolean,
          default: true,
          required: false,
        }
      # Date-only: pages show "Published · Updated" by day. Bump Last Updated
      # by hand for content edits; it's hidden when it matches Published.
      - {
          label: Published,
          name: publishedOn,
          widget: datetime,
          date_format: YYYY-MM-DD,
          time_format: false,
          format: YYYY-MM-DD,
          default: "{{now}}",
          required: false,
        }
      - {
          label: Last Updated,
          name: lastUpdatedOn,
          widget: datetime,
          date_format: YYYY-MM-DD,
          time_format: false,
          format: YYYY-MM-DD,
          required: false,
        }
      - *bodyField

media_libraries:
  default:
    config:
      slugify_filename: true
      transformations:
        raster_image:
          format: webp
          quality: 95
          # Bounding box, not a crop: Sveltia scales to fit within 3000x3000,
          # matching the check-image-metadata guard's MAX_EDGE.
          width: 3000
          height: 3000
        svg:
          optimize: true
