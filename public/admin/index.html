<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Content Manager</title>
    <style>
      /* Sveltia has no config option for side-by-side fields, so this targets
         its editor DOM: each field is a `section.field[data-key-path="<name>"]`
         sibling. When Draft directly follows Publish Date, they share a row
         if both fit and wrap onto separate rows if they don't. Each field's
         divider is an inset `::after` line; dropping the inner insets and
         letting Draft grow keeps the divider continuous across the row. */
      .content-editor
        .pane[data-mode="edit"]
        :has(
          > .field[data-key-path="publishedOn"] + .field[data-key-path="draft"]
        ) {
        display: flex;
        flex-wrap: wrap;
        > * {
          flex: 1 1 100%;
        }
        > .field[data-key-path="publishedOn"] {
          flex: 0 0 auto;
          &::after {
            right: 0;
          }
        }
        > .field[data-key-path="draft"] {
          flex: 1 0 auto;
          &::after {
            left: 0;
          }
        }
      }
    </style>
  </head>
  <body>
    <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>
    <!-- Sveltia commits through the GitHub API, so the Prettier pre-commit
         hook never sees its saves. This formats the markdown body before each
         save so CI's `prettier --check` passes. Keep the version in step with
         package.json's prettier. Frontmatter is serialized by Sveltia after
         this hook, so it stays out of reach: a title containing ": " still
         comes out single-quoted, which Prettier rewrites to double quotes. If
         Prettier fails to load, saves go through unformatted and CI flags them. -->
    <script type="module">
      import * as prettier from "https://unpkg.com/prettier@3.9.6/standalone.mjs";
      import * as markdown from "https://unpkg.com/prettier@3.9.6/plugins/markdown.mjs";

      CMS.registerEventListener({
        name: "preSave",
        handler: async ({ entry }) => {
          const data = entry.get("data");
          const body = data.get("body");
          if (typeof body !== "string") return;
          try {
            const formatted = await prettier.format(body, {
              parser: "markdown",
              plugins: [markdown],
            });
            return data.set("body", formatted);
          } catch (error) {
            console.warn("Prettier could not format the body:", error);
          }
        },
      });
    </script>
  </body>
</html>
