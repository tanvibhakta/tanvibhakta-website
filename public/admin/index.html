<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Content Manager</title>
    <style>
      /* Sveltia has no config option for side-by-side fields, so this targets
         its editor DOM: each field is a `section.field[data-key-path="<name>"]`
         sibling. When Draft directly follows Publish Date, they share a row
         if both fit and wrap onto separate rows if they don't. Each field's
         divider is an inset `::after` line; dropping the inner insets and
         letting Draft grow keeps the divider continuous across the row. */
      .content-editor
        .pane[data-mode="edit"]
        :has(
          > .field[data-key-path="publishedOn"] + .field[data-key-path="draft"]
        ) {
        display: flex;
        flex-wrap: wrap;
        > * {
          flex: 1 1 100%;
        }
        > .field[data-key-path="publishedOn"] {
          flex: 0 0 auto;
          &::after {
            right: 0;
          }
        }
        > .field[data-key-path="draft"] {
          flex: 1 0 auto;
          &::after {
            left: 0;
          }
        }
      }
    </style>
  </head>
  <body>
    <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>
    <!-- Sveltia commits through the GitHub API, so the Prettier pre-commit
         hook never sees its saves. Registering a `toFile` for the built-in
         frontmatter format lets us take Sveltia's own serialization of the
         whole file (`serialize`) and run Prettier over all of it, frontmatter
         included: Sveltia single-quotes YAML strings that need quoting
         (`audio: ''`, titles containing ": "), which Prettier rewrites to
         double quotes. Loading still uses Sveltia's built-in parser, since no
         `fromFile` is given. Sveltia trims the result and adds one newline.
         Keep the version in step with package.json's prettier;
         src/utils/format-markdown.ts does the same for Telegram notes. If
         Prettier fails, the unformatted file is saved and CI flags it. -->
    <script type="module">
      import * as prettier from "https://unpkg.com/prettier@3.9.6/standalone.mjs";
      import * as markdown from "https://unpkg.com/prettier@3.9.6/plugins/markdown.mjs";
      import * as yaml from "https://unpkg.com/prettier@3.9.6/plugins/yaml.mjs";

      const toFile = async (content, { serialize }) => {
        const text = await serialize(content);
        try {
          return await prettier.format(text, {
            parser: "markdown",
            plugins: [markdown, yaml],
          });
        } catch (error) {
          console.warn("Prettier could not format the entry:", error);
          return text;
        }
      };
      // Sveltia looks the formatter up under the configured format
      // ("frontmatter", the .md default) and then the detected one.
      CMS.registerCustomFormat("frontmatter", "md", { toFile });
      CMS.registerCustomFormat("yaml-frontmatter", "md", { toFile });
    </script>
  </body>
</html>
