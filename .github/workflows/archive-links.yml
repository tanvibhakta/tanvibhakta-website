# Records Wayback Machine snapshots for external links in posts
# (scripts/archive-links.ts) and commits src/data/archive-links.json, for the
# site to display archive links from. Runs on content pushes to main
# (Sveltia and Telegram commits included), weekly to retry links that had no
# snapshot yet, and by hand.
#
# Save Page Now captures need the ARCHIVE_ORG_ACCESS_KEY and
# ARCHIVE_ORG_SECRET_KEY repository secrets (archive.org S3 API keys); without
# them only existing snapshots are recorded.
name: Archive links

on:
  push:
    branches: [main]
    paths:
      - "posts/**"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

# One run at a time: a newer push waits rather than racing on the JSON.
concurrency:
  group: archive-links
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # Latest main, not the triggering commit: a run queued behind another
      # must start from that run's committed snapshots and see every post
      # published so far.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: "package.json"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - run: pnpm archive
        env:
          ARCHIVE_ORG_ACCESS_KEY: ${{ secrets.ARCHIVE_ORG_ACCESS_KEY }}
          ARCHIVE_ORG_SECRET_KEY: ${{ secrets.ARCHIVE_ORG_SECRET_KEY }}

      - name: Commit updated snapshots
        run: |
          if git diff --quiet -- src/data/archive-links.json; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/archive-links.json
          git commit -m "chore: update archive links"
          # Posts may have landed while this ran. Runs are serialized and each
          # starts from latest main, and nothing else edits the JSON, so
          # rebasing onto them can't conflict.
          git pull --rebase origin main
          git push origin HEAD:main
